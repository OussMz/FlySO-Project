
{% extends "base.html" %}

{% block content %}
    <div class="auth-container">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login" id="login-choice-btn">Login</button>
            <button class="auth-tab" data-tab="register" id="register-choice-btn">Register</button>
        </div>

        <div class="auth-content">
            <div class="auth-form active" id="login-form-container">
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-control" required>
                    </div>
                    <div class="hidden-message" id="sign-in-hidden-msg"></div>
                    <button type="submit" class="btn btn-primary" id="sign-in-btn">Sign In</button>
                </form>
            </div>

            <div class="auth-form" id="register-form-container">
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <input type="password" id="register-confirm-password" class="form-control" required>
                    </div>
                    <div class="hidden-message" id="sign-up-hidden-msg"></div>
                    <button type="submit" class="btn btn-primary" id="sign-up-btn">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block script%}
<script src="{{ url_for("static", filename= "login_page.js") }}"></script>
{% endblock script%}
