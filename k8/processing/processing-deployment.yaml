apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-deployment
  namespace: default
  labels:
    app: processing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
        - name: processing-service
          image: oussamamz/flyso-processing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6000
          env:
            - name: SERVERLESS_COMPONENT_URL
              valueFrom:
                secretKeyRef:
                  name: processing-secret
                  key: SERVERLESS_COMPONENT_URL
